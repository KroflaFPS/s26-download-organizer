name: Build debug APK

on:
  push:
    branches: [main, develop, 'feat/**', 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:
    inputs:
      stable_signing:
        description: 'Optional stable signing for standalone diagnostic (not required for first install)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test normal and standalone diagnostic apps
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest testDiagnosticUnitTest

      - name: Check Android lint and compile debug APK
        run: ./gradlew --no-daemon --stacktrace lintDebug lintDiagnostic assembleDebug assembleDiagnostic

      - name: Verify protected signing script with disposable test credentials
        run: python3 -m unittest discover -s tools -p "test_*.py"

      - name: Verify exported Room schema is versioned
        run: python3 tools/check_room_schema.py

      - name: Report standalone APK identity/certificate and generate disposable synthetic fixtures
        run: |
          python3 tools/report_apk.py app/build/outputs/apk/diagnostic/app-diagnostic.apk --expect-package com.kroflafps.s26downloadorganizer.diagnostic --output app/build/outputs/apk/diagnostic/certificate.txt
          python3 tools/create_test_fixtures.py "$RUNNER_TEMP/s26-synthetic-fixtures"

      - name: Upload synthetic test fixtures (no user data)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: s26-build-3-2-synthetic-fixtures
          path: ${{ runner.temp }}/s26-synthetic-fixtures/
          if-no-files-found: error
          retention-days: 14

      - name: Upload standalone diagnostic APK only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: s26-build-3-2-standalone-diagnostic
          path: |
            app/build/outputs/apk/diagnostic/app-diagnostic.apk
            app/build/outputs/apk/diagnostic/certificate.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-3-2-verification-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/tests/testDiagnosticUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/test-results/testDiagnosticUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/reports/lint-results-diagnostic.*
            app/schemas/
          if-no-files-found: warn
          retention-days: 14

  stable-signing:
    name: Stable-sign engineering APK (synthetic test copy only; MOVE/UNDO disabled)
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.stable_signing }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: development-signing
    steps:
      - name: Check out trusted main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android signing tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Download this run's standalone diagnostic APK
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: s26-build-3-2-standalone-diagnostic
          path: unsigned-input
      - name: Sign and verify pinned certificate
        env:
          S26_DEV_KEYSTORE_BASE64: ${{ secrets.S26_DEV_KEYSTORE_BASE64 }}
          S26_DEV_STORE_PASSWORD: ${{ secrets.S26_DEV_STORE_PASSWORD }}
          S26_DEV_KEY_ALIAS: ${{ secrets.S26_DEV_KEY_ALIAS }}
          S26_DEV_KEY_PASSWORD: ${{ secrets.S26_DEV_KEY_PASSWORD }}
          S26_DEV_CERT_SHA256: ${{ secrets.S26_DEV_CERT_SHA256 }}
        run: python3 tools/sign_engineering_apk.py
      - name: Upload stable-signed engineering APK and public certificate report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: s26-build-3-2-stable-signed-standalone-diagnostic
          path: ${{ runner.temp }}/s26-signed-output/
          if-no-files-found: error
          retention-days: 14
